# Alembic configuration file for the Stock Investment Dashboard backend.
# The sqlalchemy.url is overridden at runtime by env.py using settings.database_url.

[alembic]
# Path to migration scripts, relative to this file's location (backend/).
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for revision file creation timestamps.
timezone = UTC

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Placeholder URL — overridden by env.py at runtime.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
