# =============================================================================
# GitHub Actions — Deploy on merge to main
# SSHs into VM, pulls code, rebuilds backend container (zero-downtime)
# =============================================================================
#
# Required GitHub Secrets:
#   VM_HOST      — IP or hostname of your VM
#   VM_USER      — SSH username (e.g., root or deploy)
#   VM_SSH_KEY   — Private SSH key for authentication
#   VM_APP_PATH  — Path to the app on the VM (e.g., /opt/investor)
#
name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ${{ secrets.VM_APP_PATH }}
            git pull origin main
            
            # Check if frontend changed
            FRONTEND_CHANGED=$(git diff HEAD~1 --name-only | grep "^frontend/" || true)
            
            if [ -n "$FRONTEND_CHANGED" ]; then
              echo "Frontend changed — rebuilding all..."
              docker compose -f docker-compose.prod.yml build frontend-builder backend
              docker compose -f docker-compose.prod.yml up -d frontend-builder
              sleep 5
              docker compose -f docker-compose.prod.yml up -d --no-deps backend
            else
              echo "Backend only — zero-downtime swap..."
              docker compose -f docker-compose.prod.yml build backend
              docker compose -f docker-compose.prod.yml up -d --no-deps backend
            fi
            
            # Wait and verify
            sleep 10
            curl -sf http://localhost:8000/health || exit 1
            echo "✅ Deployment successful"
