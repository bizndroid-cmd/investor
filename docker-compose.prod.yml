# =============================================================================
# Production Docker Compose
# Isolated networking, zero-downtime backend deploys, automatic HTTPS
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Internal only, no exposed ports
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stockdash_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockdash}
      POSTGRES_USER: ${POSTGRES_USER:-stockdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockdash} -d ${POSTGRES_DB:-stockdash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # NO ports: exposed — internal only

  # ---------------------------------------------------------------------------
  # Redis — Internal only, no exposed ports
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stockdash_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # NO ports: exposed — internal only

  # ---------------------------------------------------------------------------
  # FastAPI Backend — Connects to internal Postgres & Redis
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stockdash_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stockdash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockdash}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # NO ports: exposed to host — only accessible via Caddy proxy

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy — Only public-facing container
  # Automatic HTTPS via Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: stockdash_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_static:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - app-network
    depends_on:
      - backend
      - frontend-builder
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Builder — Builds static files, exits after copy
  # ---------------------------------------------------------------------------
  frontend-builder:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: stockdash_frontend_builder
    volumes:
      - frontend_static:/output
    entrypoint: ["sh", "-c", "cp -r /static/* /output/ && echo 'Frontend built and copied'"]
    networks:
      - app-network

# =============================================================================
# Volumes — Persistent data survives container rebuilds
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  frontend_static:
    driver: local

# =============================================================================
# Network — Isolated bridge, internal communication only
# =============================================================================
networks:
  app-network:
    driver: bridge
